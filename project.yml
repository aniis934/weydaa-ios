# Projet Xcode décrit pour XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Le .xcodeproj est GÉNÉRÉ par la CI (`xcodegen generate`) et n'est jamais commité.
name: Weyda

options:
  bundleIdPrefix: com.weydaa
  developmentLanguage: fr
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_ENABLE_OBJC_WEAK: YES

# Seule dépendance externe : Firebase (push FCM + Crashlytics), accordée par le propriétaire pour la phase 5, en
# version EXACTE (aucune mise à jour silencieuse). Inerte sans GoogleService-Info.plist (CI, captures) : voir
# Weyda/Core/Push/FirebasePush.swift. Paquets mis en cache par la CI (scripts/ci/resolve-packages.sh).
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: "12.19.2"

targets:
  Weyda:
    type: application
    platform: iOS
    sources:
      - path: Weyda
        excludes:
          - "Resources/Info.plist"
          - "Mock/MockFixtures"
          - "Mock/MockFixtures/**"
      # Réponses de l'API simulée : dossier copié tel quel, retiré des builds Release (voir plus bas).
      - path: Weyda/Mock/MockFixtures
        type: folder
        buildPhase: resources
    # Produits Firebase (Package.swift 12.19.2) ; modules importés par Core/Push/FirebasePush.swift seulement.
    dependencies:
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseCrashlytics
    settings:
      base:
        PRODUCT_NAME: Weyda
        PRODUCT_BUNDLE_IDENTIFIER: com.weydaa.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Weyda/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Weydaa
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.shopping
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Concurrence : isolation MainActor par défaut + « approachable concurrency » (réglages
        # d'Xcode 26). Les types de données et la logique pure sont marqués `nonisolated`.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: MockFixtures
          # Push, liens universels, Se connecter avec Apple : archive signée seulement (les builds Debug de la CI, au
          # simulateur et sans équipe Apple, n'ont pas d'entitlements).
          CODE_SIGN_ENTITLEMENTS: Config/Weyda.entitlements

  WeydaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeydaTests
    dependencies:
      - target: Weyda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weydaa.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Weyda.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Weyda"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_STRICT_CONCURRENCY: complete

  WeydaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: WeydaUITests
    dependencies:
      - target: Weyda
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.weydaa.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Weyda
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Weyda:
    build:
      targets:
        Weyda: all
        WeydaTests: [test]
        WeydaUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: WeydaTests
        - name: WeydaUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
