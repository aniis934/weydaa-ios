name: ios-screens

# Tour automatique de l'app en API simulée (aucun appel à la prod) : captures de chaque écran
# en fr / ar / en × clair / sombre × 2 tailles d'iPhone, plus une vidéo du parcours.
# À la demande (fin de phase) : `gh workflow run ios-screens.yml --ref <branche>` (le workflow doit
# être sur main pour ça), ou depuis n'importe quelle branche : `git tag screens-<x> && git push origin screens-<x>`.
#
# Une seule compilation, puis un tour par appareil × langue EN PARALLÈLE (Mac gratuits du dépôt
# public) : le tour séquentiel de la phase 0 prenait 26 min.
on:
  push:
    tags: ["screens-*"]
  workflow_dispatch:
    inputs:
      languages:
        description: Langues (séparées par des espaces)
        default: fr ar en
      appearances:
        description: Apparences
        default: light dark
      devices:
        description: Appareils (séparés par ;)
        default: iPhone 17 Pro Max;iPhone 17e

permissions:
  contents: read

env:
  XCODEGEN_VERSION: "2.46.0"
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  # Paquets Swift clonés (Firebase) : dossier commun à resolve-packages.sh, à la compilation et au cache.
  SPM_DIR: build/spm

jobs:
  plan:
    name: Matrice
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          LANGS: ${{ inputs.languages || 'fr ar en' }}
          DEVICES: ${{ inputs.devices || 'iPhone 17 Pro Max;iPhone 17e' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          langs = os.environ["LANGS"].split()
          devices = [d.strip() for d in os.environ["DEVICES"].split(";") if d.strip()]
          include = [{"device": d, "lang": l} for d in devices for l in langs]
          print("matrix=" + json.dumps({"include": include}))
          PY

  build:
    name: Compilation pour les tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: XcodeGen en cache
        id: xcodegen
        uses: actions/cache@v6
        with:
          path: ~/.xcodegen-dist
          key: xcodegen-${{ env.XCODEGEN_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Installer XcodeGen
        if: steps.xcodegen.outputs.cache-hit != 'true'
        run: bash scripts/ci/install-xcodegen.sh

      - name: Générer le projet Xcode
        run: bash scripts/ci/generate.sh

      # Paquets Swift (Firebase) : même cache et même dossier que ios-ci (scripts/ci/resolve-packages.sh).
      - name: Paquets Swift en cache
        id: spm
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SPM_DIR }}
          key: spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Résoudre les paquets Swift
        run: bash scripts/ci/resolve-packages.sh

      - name: Sauver les paquets Swift
        if: steps.spm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SPM_DIR }}
          key: ${{ steps.spm.outputs.cache-primary-key }}

      - name: Compiler pour les tests
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild build-for-testing \
            -project Weyda.xcodeproj \
            -scheme Weyda \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro Max,OS=latest" \
            -derivedDataPath build/dd \
            -clonedSourcePackagesDirPath "$SPM_DIR" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee build/logs/build-for-testing.log | xcbeautify --renderer github-actions

      # tar : l'artefact GitHub ne garde pas les droits d'exécution des binaires de l'app.
      - name: Emballer les produits
        run: tar -czf products.tgz -C build/dd/Build Products

      - uses: actions/upload-artifact@v7
        with:
          name: ios-products
          path: products.tgz
          retention-days: 1

      - name: Journal (échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screens-build-log
          path: build/logs/
          retention-days: 7
          if-no-files-found: ignore

  tour:
    name: Tour ${{ matrix.device }} · ${{ matrix.lang }}
    needs: [plan, build]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ios-products

      - name: Déballer les produits
        run: |
          mkdir -p build/dd/Build
          tar -xzf products.tgz -C build/dd/Build

      - name: Tour (captures + vidéo)
        env:
          LANGS: ${{ matrix.lang }}
          APPEARANCES: ${{ inputs.appearances || 'light dark' }}
          DEVICES: ${{ matrix.device }}
          # Une vidéo par appareil (le tour en français), pas une par langue.
          VIDEO: ${{ matrix.lang == 'fr' && '1' || '0' }}
        run: bash scripts/ci/screens.sh

      - name: Nom de l'artefact
        id: name
        env:
          DEVICE: ${{ matrix.device }}
        run: echo "slug=$(echo "$DEVICE" | tr ' ' '-' | tr -cd '[:alnum:]-')" >> "$GITHUB_OUTPUT"

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screens-${{ steps.name.outputs.slug }}-${{ matrix.lang }}
          path: screens/
          retention-days: 14
          if-no-files-found: warn

      - name: Résultats bruts (échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-screens-results-${{ steps.name.outputs.slug }}-${{ matrix.lang }}
          path: build/results/
          retention-days: 7
          if-no-files-found: ignore
